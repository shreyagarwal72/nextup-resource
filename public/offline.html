<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>You're offline — Nextup Resources</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root { --ink: #14121f; --cream: #fffdf5; --violet: #7c5cff; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
        background: var(--cream) radial-gradient(circle, rgba(20,18,31,.10) 1px, transparent 1px);
        background-size: 22px 22px;
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif; color: var(--ink);
      }
      .card {
        max-width: 26rem; width: 100%; text-align: center; background: #fff; padding: 2rem 1.75rem;
        border: 2px solid rgba(20,18,31,.8); border-radius: 24px; box-shadow: 8px 8px 0 0 var(--ink);
        animation: pop .45s cubic-bezier(.34,1.56,.64,1);
      }
      .badge {
        width: 76px; height: 76px; margin: 0 auto 1.25rem; display: grid; place-items: center;
        border: 2px solid rgba(20,18,31,.8); border-radius: 999px; background: #ffd84d;
        box-shadow: 6px 6px 0 0 var(--ink); animation: float 4s ease-in-out infinite; font-size: 2rem;
      }
      h1 { font-family: "Outfit", system-ui, sans-serif; font-size: 1.6rem; margin: 0 0 .5rem; }
      p { margin: 0; font-size: .95rem; line-height: 1.55; color: rgba(20,18,31,.7); }
      a.btn {
        display: inline-block; margin-top: 1.5rem; padding: .85rem 1.5rem; border-radius: 16px;
        background: var(--violet); color: #fff; font-weight: 700; text-decoration: none;
        border: 2px solid rgba(20,18,31,.8); box-shadow: 6px 6px 0 0 var(--ink);
        transition: transform .2s cubic-bezier(.34,1.56,.64,1);
      }
      a.btn:hover { transform: translate(-2px,-2px); }
      @keyframes pop { 0% { transform: scale(.9); opacity: 0 } 100% { transform: scale(1); opacity: 1 } }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge" aria-hidden="true">📡</div>
      <h1>You're offline</h1>
      <p>Nextup Resources can't reach the internet right now. Reconnect and try again — pages you've already opened stay available offline.</p>
      <a class="btn" href="/">Retry</a>
    </main>
  </body>
</html>
