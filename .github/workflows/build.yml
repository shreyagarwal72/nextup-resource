name: Build & Package Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & build Web App
        run: |
          npm install
          npm run build

      - name: Install Bubblewrap CLI & Build APK
        run: |
          npm install -g @bubblewrap/cli
          npx @bubblewrap/cli init --manifest=http://localhost:8080/manifest.webmanifest || true
          mkdir -p apk-output
          # Package web dist into an Android APK using Bubblewrap / TWA template
          npx @bubblewrap/cli build || true
          find . -name "*.apk" -exec cp {} apk-output/ \; || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextupResources-APK
          path: apk-output/*.apk

      - name: Create Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: apk-output/*.apk
          tag_name: v1.0.0
          name: "Nextup Resources App Release"
          body: "Official offline-ready Android APK for Nextup Resources."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}